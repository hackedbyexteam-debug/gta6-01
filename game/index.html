<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — an open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050914; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<!-- three.js r152, vendored locally — no network request, ever. -->
<script src="./vendor/three.min.js"></script>
</head>
<body>
<canvas id="game" aria-label="SOLMAR HEAT: explore Solmar City on foot and by car, take jobs, outrun the police"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
